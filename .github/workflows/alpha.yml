name: Alpha Build

on:
  push:
    branches:
      - develop

jobs:
  build-alpha:
    name: Build Alpha Apk
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          submodules: 'recursive'

      - name: Sync and Force Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle to generate and submit dependency graphs
        uses: gradle/actions/setup-gradle@v3
        with:
          dependency-graph: generate-and-submit

      - name: Write google-services.json
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Add signing properties
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          echo '${{ secrets.SIGNING_PROPERTIES }}' > encoded_signing_properties
          base64 -Dd -i encoded_signing_properties > signing.properties

      - name: Add jks file
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          echo '${{ secrets.SIGN_KEY }}' > ./encoded_key
          base64 -Dd -i encoded_key > key.jks

      - name: Build apk
        run: ./gradlew assembleDefaultAlpha assembleDefaultDebug --stacktrace

      # ================= 关键修改 START =================
      # 重新引入调试步骤，这次我们将看到真相
      - name: Find APK and Metadata files
        run: |
          echo "--- Listing ALL files in app/build/outputs ---"
          # 使用 find 命令，它会递归地列出所有文件和它们的完整路径
          find app/build/outputs -type f
      # ================= 关键修改 END ===================

