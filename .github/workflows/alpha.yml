name: Alpha Build

on:
  push:
    branches:
      - develop

jobs:
  build-alpha:
    name: Build Alpha Apk
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          submodules: 'recursive'

      - name: Sync and Force Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle to generate and submit dependency graphs
        uses: gradle/actions/setup-gradle@v3
        with:
          dependency-graph: generate-and-submit

      - name: Write google-services.json
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Add signing properties
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          echo '${{ secrets.SIGNING_PROPERTIES }}' > encoded_signing_properties
          base64 -Dd -i encoded_signing_properties > signing.properties

      - name: Add jks file
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          echo '${{ secrets.SIGN_KEY }}' > ./encoded_key
          base64 -Dd -i encoded_key > key.jks

      - name: Build apk
        run: ./gradlew assembleDefaultAlpha assembleDefaultDebug --stacktrace

      # 移除调试步骤，因为我们现在要直接修复路径
      # - name: Debug APK Output Path

      # ================= 关键修改 START =================
      # 修正 output-metadata.json 文件的路径
      - name: Parse apk infos
        id: apk-infos
        run: |
          # 根据 flavor + buildType 的标准命名规则，修正路径
          alpha_meta_path="app/build/outputs/apk/default/alpha/output-metadata.json"
          debug_meta_path="app/build/outputs/apk/default/debug/output-metadata.json"
          
          echo "alpha_info_version_code=$(jq -r '.elements[0].versionCode' $alpha_meta_path)" >> $GITHUB_ENV
          echo "alpha_info_version_name=$(jq -r '.elements[0].versionName' $alpha_meta_path)" >> $GITHUB_ENV
          echo "alpha_debug_info_version_code=$(jq -r '.elements[0].versionCode' $debug_meta_path)" >> $GITHUB_ENV
          echo "alpha_debug_info_version_name=$(jq -r '.elements[0].versionName' $debug_meta_path)" >> $GITHUB_ENV

      - name: Determine tag name
        id: tag_name
        run: echo "tag_name=alpha-r${{ env.alpha_info_version_code }}" >> $GITHUB_ENV

      - name: Get changelog
        id: changelog
        run: |
          {
            echo "changelog<<EOF"
            echo "$(git log --pretty=format:"- %s (%h)" ${{ github.event.before }}..${{ github.sha }})"
            echo "EOF"
          } >> "$GITHUB_ENV"
      
      # 修正所有 APK 和 mapping 文件的路径
      - name: Archive alpha debug build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alpha debug build artifact
          # 修正路径
          path: app/build/outputs/apk/default/debug/BV_${{ env.alpha_debug_info_version_code }}_${{ env.alpha_debug_info_version_name }}.debug_default_universal.apk

      - name: Archive default alpha build mappings
        uses: actions/upload-artifact@v4
        with:
          name: Alpha build mappings
          # 修正路径
          path: app/build/outputs/mapping/defaultAlpha/

      - name: Archive alpha build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alpha build artifact
          # 修正路径
          path: app/build/outputs/apk/default/alpha/BV_${{ env.alpha_info_version_code }}_${{ env.alpha_info_version_name }}.alpha_default_universal.apk

      - name: Zip mapping
        run: zip -rj mapping.zip app/build/outputs/mapping/defaultAlpha

      - name: Publish Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          # 修正路径
          files: |
            app/build/outputs/apk/default/debug/BV_${{ env.alpha_debug_info_version_code }}_${{ env.alpha_debug_info_version_name }}.debug_default_universal.apk
            app/build/outputs/apk/default/alpha/BV_${{ env.alpha_info_version_code }}_${{ env.alpha_info_version_name }}.alpha_default_universal.apk
            mapping.zip
          tag_name: ${{ env.tag_name }}
          name: ${{ env.alpha_info_version_name }}
          prerelease: true
          body: ${{ env.changelog }}
          target_commitish: ${{ github.sha }}
      # ================= 关键修改 END ===================
