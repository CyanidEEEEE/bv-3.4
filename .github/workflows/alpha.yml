name: Alpha Build

on:
  push:
    branches:
      - develop

jobs:
  build-alpha:
    name: Build Alpha Apk
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      # ... (前面从 Checkout 到 Build apk 的步骤都保持不变) ...
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          submodules: 'recursive'

      - name: Sync and Force Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle to generate and submit dependency graphs
        uses: gradle/actions/setup-gradle@v3
        with:
          dependency-graph: generate-and-submit

      - name: Write google-services.json
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Add signing properties
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          echo '${{ secrets.SIGNING_PROPERTIES }}' > encoded_signing_properties
          base64 -Dd -i encoded_signing_properties > signing.properties

      - name: Add jks file
        env:
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          echo '${{ secrets.SIGN_KEY }}' > ./encoded_key
          base64 -Dd -i encoded_key > key.jks

      - name: Build apk
        run: ./gradlew assembleDefaultAlpha assembleDefaultDebug --stacktrace

      # ================= 终极修正 START =================
      
      - name: Parse infos and find artifact paths
        id: apk-infos
        run: |
          # 1. 解析版本信息 (和以前一样)
          alpha_meta_path="app/build/outputs/apk/default/alpha/output-metadata.json"
          debug_meta_path="app/build/outputs/apk/default/debug/output-metadata.json"
          
          echo "alpha_info_version_code=$(jq -r '.elements[0].versionCode' $alpha_meta_path)" >> $GITHUB_ENV
          echo "alpha_info_version_name=$(jq -r '.elements[0].versionName' $alpha_meta_path)" >> $GITHUB_ENV
          
          # 2. 【关键】直接搜索APK文件的完整路径，不再猜测文件名！
          #    -name '*.apk' 查找所有以.apk结尾的文件
          #    -type f 确保是文件而不是目录
          alpha_apk_path=$(find app/build/outputs/apk/default/alpha -type f -name "*.apk")
          debug_apk_path=$(find app/build/outputs/apk/default/debug -type f -name "*.apk")
          
          # 3. 将找到的完整路径存入环境变量
          echo "alpha_apk_path=$alpha_apk_path" >> $GITHUB_ENV
          echo "debug_apk_path=$debug_apk_path" >> $GITHUB_ENV
          
          echo "Found Alpha APK at: $alpha_apk_path"
          echo "Found Debug APK at: $debug_apk_path"

      - name: Determine tag name
        id: tag_name
        run: echo "tag_name=alpha-r${{ env.alpha_info_version_code }}" >> $GITHUB_ENV

      - name: Get changelog
        id: changelog
        run: |
          {
            echo "changelog<<EOF"
            echo "$(git log --pretty=format:"- %s (%h)" ${{ github.event.before }}..${{ github.sha }})"
            echo "EOF"
          } >> "$GITHUB_ENV"
      
      # 直接使用我们找到的完整路径变量
      - name: Archive alpha debug build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alpha debug build artifact
          path: ${{ env.debug_apk_path }}

      - name: Archive default alpha build mappings
        uses: actions/upload-artifact@v4
        with:
          name: Alpha build mappings
          path: app/build/outputs/mapping/defaultAlpha/

      - name: Archive alpha build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alpha build artifact
          path: ${{ env.alpha_apk_path }}

      - name: Zip mapping
        run: zip -rj mapping.zip app/build/outputs/mapping/defaultAlpha

      - name: Publish Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          # 直接使用我们找到的完整路径变量
          files: |
            ${{ env.debug_apk_path }}
            ${{ env.alpha_apk_path }}
            mapping.zip
          tag_name: ${{ env.tag_name }}
          name: Alpha ${{ env.alpha_info_version_name }}
          prerelease: true
          body: ${{ env.changelog }}
          target_commitish: ${{ github.sha }}
      # ================= 终极修正 END ===================
